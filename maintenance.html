
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MineHost está em manutenção.">
  <title>Manutenção - MineHost</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1120;
      color: white;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111c32;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      color: #38bdf8;
      font-size: 28px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .maintenance-box {
      max-width: 550px;
      width: 100%;
      text-align: center;
      background: #172338;
      padding: 40px 25px;
      border-radius: 15px;
    }

    .icon {
      font-size: 65px;
      margin-bottom: 20px;
    }

    h2 {
      color: #38bdf8;
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .notice {
      background: #302b19;
      color: #facc15;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 13px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #64748b;
    }

    @media (max-width: 480px) {
      .maintenance-box {
        padding: 30px 18px;
      }

      h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>MineHost</h1>
  </header>

  <main>
    <section class="maintenance-box">

      <div class="icon">🛠️</div>

      <h2>Estamos em manutenção!</h2>

      <p>
        Estamos trabalhando para melhorar o MineHost
        e preparar novos recursos para você.
      </p>

      <div class="notice">
        ⚠️ Esta é uma página demonstrativa de manutenção.
      </div>

      <p>
        Agradecemos pela paciência!
        Em breve teremos novidades.
      </p>

      <a href="index.html" class="button">
        Voltar ao início
      </a>

    </section>
  </main>

  <footer>
    © 2026 MineHost - Todos os direitos reservados.
  </footer>

</body>
      </html>
