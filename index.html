
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineHost - Hospedagem Minecraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1120;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111c30;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #38a5ff;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        .hero span {
            color: #38a5ff;
        }

        .hero p {
            color: #aab8cc;
            margin-bottom: 30px;
        }

        button {
            background: #1685ed;
            color: white;
            border: none;
            padding: 15px 28px;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">MineHost</div>
    <div>☰</div>
</header>

<section class="hero">
    <h1>Seu servidor.<br><span>Suas regras.</span></h1>
    <p>Crie seu próprio servidor Minecraft gratuitamente.</p>
    <button>Começar agora</button>
</section>

</body>
