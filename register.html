
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080e1b">
<title>Criar conta - MineHost</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080e1b;
    font-family: Arial, sans-serif;
    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 400px;
    padding: 35px;
    background: #111e31;
    border: 1px solid #233752;
    border-radius: 16px;
}

.logo {
    text-align: center;
    color: #ff8a00;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 25px;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

.description {
    text-align: center;
    color: #91a3bb;
    font-size: 14px;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    background: #080e1b;
    border: 1px solid #30445e;
    border-radius: 8px;
    color: white;
    outline: none;
}

input:focus {
    border-color: #ff8a00;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #ff8a00;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.login {
    text-align: center;
    color: #91a3bb;
    font-size: 14px;
    margin-top: 22px;
}

a {
    color: #ff9d26;
    text-decoration: none;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
}

#mensagem {
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">MineHost.</div>

    <h2>Criar sua conta</h2>

    <p class="description">
        Entre para conhecer a experiência MineHost.
    </p>

    <form id="registerForm">

        <label for="nome">Nome de usuário</label>
        <input
            type="text"
            id="nome"
            placeholder="Seu nome"
            minlength="3"
            maxlength="30"
            autocomplete="username"
            required
        >

        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            placeholder="Seu e-mail"
            autocomplete="email"
            required
        >

        <label for="senha">Senha</label>
        <input
            type="password"
            id="senha"
            placeholder="Crie uma senha"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <label for="confirmacao">Confirmar senha</label>
        <input
            type="password"
            id="confirmacao"
            placeholder="Digite a senha novamente"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <button type="submit" id="botao">
            Criar minha conta →
        </button>

    </form>

    <p id="mensagem" role="status"></p>

    <p class="login">
        Já possui uma conta?
        <a href="login.html">Entrar</a>
    </p>

    <a href="index.html" class="back">← Voltar ao início</a>

</div>

<script>
const API_URL = "http://localhost:3000/api";

const formulario = document.getElementById("registerForm");
const mensagem = document.getElementById("mensagem");
const botao = document.getElementById("botao");

formulario.addEventListener("submit", async function(event) {
    event.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const confirmacao = document.getElementById("confirmacao").value;

    if (senha !== confirmacao) {
        mensagem.textContent = "As senhas não são iguais.";
        return;
    }

    if (nome.length < 3) {
        mensagem.textContent = "O nome precisa ter pelo menos 3 caracteres.";
        return;
    }

    botao.disabled = true;
    mensagem.textContent = "Criando sua conta...";

    try {
        const resposta = await fetch(`${API_URL}/auth/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nome,
                email,
                senha,
                confirmacao
            })
        });

        const dados = await resposta.json();

        if (!resposta.ok || !dados.sucesso) {
            throw new Error(dados.mensagem || "Não foi possível criar sua conta.");
        }

        if (dados.token) {
            localStorage.setItem("minehost_token", dados.token);
            mensagem.textContent = "Conta criada! Redirecionando...";
            window.location.href = "profile.html";
        } else {
            mensagem.textContent = "Conta criada! Faça login para continuar.";
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);
        }

    } catch (erro) {
        mensagem.textContent =
            erro.message === "Failed to fetch"
            ? "Não foi possível conectar ao servidor MineHost."
            : erro.message;

        botao.disabled = false;
    }
});
</script>

</body>
</html>
