
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página não encontrada - MineHost">
  <title>404 - Página não encontrada | MineHost</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1120;
      color: white;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111c32;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      color: #38bdf8;
      font-size: 28px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .error-box {
      text-align: center;
      max-width: 500px;
    }

    .error-code {
      font-size: 110px;
      font-weight: bold;
      color: #38bdf8;
      text-shadow: 0 0 30px #0284c7;
    }

    h2 {
      font-size: 27px;
      margin-bottom: 15px;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .home {
      background: #2563eb;
      color: white;
    }

    .back {
      background: #1e293b;
      color: #cbd5e1;
    }

    a:hover {
      opacity: 0.8;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }

    @media (max-width: 480px) {
      .error-code {
        font-size: 85px;
      }

      h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>MineHost</h1>
  </header>

  <main>
    <div class="error-box">

      <div class="error-code">404</div>

      <h2>Ops! Página não encontrada.</h2>

      <p>
        Parece que você tentou acessar uma página
        que não existe ou foi movida.
        Não se preocupe, você pode voltar ao início.
      </p>

      <div class="buttons">
        <a href="index.html" class="home">
          Voltar ao início
        </a>

        <a href="javascript:history.back()" class="back">
          Voltar à página anterior
        </a>
      </div>

    </div>
  </main>

  <footer>
    © 2026 MineHost - Todos os direitos reservados.
  </footer>

</body>
  </html>
