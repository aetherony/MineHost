
services:
  app:
    build: .
    container_name: minehost-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://minehost:${DB_PASSWORD}@database:5432/minehost
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    container_name: minehost-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: minehost
      POSTGRES_USER: minehost
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - minehost_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minehost -d minehost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minehost_data:
  
